name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  EMSDK_VERSION: 6.0.11

jobs:
  # what opam-repository's CI does: lint, build, install from the opam file
  opam:
    strategy:
      fail-fast: false
      matrix:
        ocaml: ['4.14', '5.5']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      # c_of_ocaml from its 0.1.0 tag until it is in opam-repository
      - run: opam pin add -n -y c_of_ocaml.0.1.0 git+https://github.com/rboudrouss/C_of_ocaml.git#0.1.0
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @install
      - run: opam lint ocaml-emcc.opam
      - run: opam install . --with-test
      - name: the installed CLI finds its share directory
        run: opam exec -- ocaml-emcc env | grep -q "share.*/share/ocaml-emcc$"

  # tests/run.sh: each test built natively and with ocaml-emcc, the
  # bytecode compiled to C by c_of_ocaml (the default), outputs compared
  test:
    strategy:
      fail-fast: false
      matrix:
        ocaml: ['4.14', '5.5']
        # wasi: OUT.wasm --wasi, run with node's WASI
        target: [wasm32, wasm64, wasi]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # the ocaml recipe rebuilds the runtime from the compiler's sources
      OPAMKEEPBUILDDIR: true
      EMSDK: ${{ github.workspace }}/../emsdk
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      # memory64 needs node >= 24, used when emsdk ships none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Install the packages of the tests
        run: |
          pkgs="ocamlfind zarith digestif yojson re cmdliner zlib apron sqlite3 bz2 zstd gsl camlzip ctypes-foreign yaml"
          pkgs="$pkgs checkseum bigstringaf mirage-crypto-ec mirage-crypto-pk mirage-crypto-rng"
          pkgs="$pkgs lwt cryptokit minisat ocaml-lua stb_image extunix snappy argon2 ocaml-expat lmdb glpk fftw3"
          pkgs="$pkgs secp256k1-internal tsdl mlcuddidl hacl-star posix-time2 posix-socket posix-stat mccs raylib"
          pkgs="$pkgs js_of_ocaml js_of_ocaml-ppx flint"
          # apron with its PPL domains (and fppol: libglpk-dev, for glpk)
          pkgs="$pkgs conf-ppl"
          # argon2 binds libargon2 with ctypes-foreign and has no conf package
          sudo apt-get install -y libargon2-dev
          # mlmpfr does not build with OCaml 5 (upstream issue); leveldb and
          # xxhash (oasis) are for OCaml 4 only
          case ${{ matrix.ocaml }} in 4.*) pkgs="$pkgs mlmpfr leveldb xxhash" ;; esac
          # the package of tests/depgraph (mpfr through pkg-config, zarith)
          opam install $pkgs ./tests/depgraph/pkg
      # tests/jsdom runs a page in headless Chromium
      - name: Install playwright
        if: matrix.target != 'wasi'
        run: |
          mkdir -p ../pw && cd ../pw && npm init -y >/dev/null && npm i playwright@1
          npx playwright install --with-deps chromium-headless-shell
          echo "PLAYWRIGHT_DIR=$(pwd)" >> "$GITHUB_ENV"
      # c_of_ocaml, in the switch (built by its compiler, for its bytecode
      # format), where ocaml-emcc finds it; from its 0.1.0 tag until
      # c_of_ocaml.0.1.0 is in opam-repository
      - name: Install c_of_ocaml
        run: |
          opam pin add -n -y c_of_ocaml.0.1.0 git+https://github.com/rboudrouss/C_of_ocaml.git#0.1.0
          opam install -y . --deps-only
      - run: opam exec -- dune build
      # under WASI, wasi-threads needs wasmtime <= 46, sockets wasmer
      - name: Install wasmtime 46 (wasi-threads) and wasmer (WASIX)
        if: matrix.target == 'wasi'
        run: |
          mkdir -p ../wasmtime ../wasmer && cd ../wasmtime
          curl -sSLf https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.0/wasmtime-v46.0.0-x86_64-linux.tar.xz | tar xJ
          echo "WASMTIME_THREADS=$(pwd)/wasmtime-v46.0.0-x86_64-linux/wasmtime" >> "$GITHUB_ENV"
          cd ../wasmer
          curl -sSLf https://github.com/wasmerio/wasmer/releases/download/v7.5.0/wasmer-linux-amd64.tar.gz | tar xz
          echo "WASMER=$(pwd)/bin/wasmer" >> "$GITHUB_ENV"
      - name: tests/run.sh (${{ matrix.target }})
        run: |
          case ${{ matrix.target }} in wasi) args=--wasi ;; *) args="--target ${{ matrix.target }}" ;; esac
          opam exec -- bash -c "SWITCH=\$(opam var prefix) tests/run.sh $args"
      # the runtime's threads and sockets, interpreted too, Dynlink's plugins,
      # file mappings
      - name: tests/run.sh --interpreted threads sockets dynbyte mapfile (${{ matrix.target }})
        run: |
          case ${{ matrix.target }} in wasi) args=--wasi ;; *) args="--target ${{ matrix.target }}" ;; esac
          args="$args --interpreted"
          opam exec -- bash -c "SWITCH=\$(opam var prefix) tests/run.sh $args threads domains threadsweb lwtthreads sockets dynbyte mapfile"
      # (cancelled: a timeout)
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.ocaml }}-${{ matrix.target }}
          path: |
            tests/*/out.log
            tests/*/out/
            _opam/emcc-sysroot/*/build/*/*.log
