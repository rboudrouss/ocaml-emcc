name: Windows

# what opam-repository's CI does on Windows: a mingw switch under Cygwin
# or MSYS2, `dune build -p ocaml-emcc @install @runtest`
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  opam:
    strategy:
      fail-fast: false
      matrix:
        ocaml: ['4.14', '5.5']
        environment: [cygwin, msys2]
    runs-on: windows-latest
    steps:
      # the sources as in the release tarball, without CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          windows-environment: ${{ matrix.environment }}
      # c_of_ocaml from its master until c_of_ocaml.0.1.0 is in opam-repository
      - run: opam pin add -n -y c_of_ocaml.0.1.0 'git+https://github.com/rboudrouss/C_of_ocaml.git#master'
      - run: opam install . --deps-only --with-test
      # quoted: PowerShell takes @install for a splatted variable
      - run: opam exec -- dune build -p ocaml-emcc '@install' '@runtest'
